<svg xmlns="http://www.w3.org/2000/svg" width="352" height="382" viewBox="0 0 352 382" role="img" aria-label="dsh-session-toast notification card states">
  <defs>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <clipPath id="clipOk"><rect x="16" y="16" width="320" height="106" rx="16"/></clipPath>
    <clipPath id="clipError"><rect x="16" y="134" width="320" height="106" rx="16"/></clipPath>
    <clipPath id="clipWarn"><rect x="16" y="252" width="320" height="106" rx="16"/></clipPath>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
    <g>
      <rect x="16" y="16" width="320" height="106" rx="16" fill="#ffffff" stroke="#0000001a" stroke-width="0.5" filter="url(#cardShadow)"/>
      <g clip-path="url(#clipOk)">
        <rect x="16" y="87" width="320" height="35" fill="#f7f7f7"/>
        <rect x="16" y="120" width="178" height="2" fill="#22c55e" opacity="0.5"/>
        <text x="28" y="109" font-size="12" fill="#61666b">此消息将在 <tspan font-weight="600" fill="#0f1115">5</tspan> 秒后关闭，<tspan font-weight="600" fill="#0f1115">点击停止</tspan>。</text>
      </g>
      <g transform="translate(28,27)" fill="none" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.3 8.5l3.1 3.1 6.3-7.2"/>
      </g>
      <text x="52" y="41" font-size="13" font-weight="600" fill="#0f1115">测试通过</text>
      <g transform="translate(275,29)" fill="none" stroke="#61666b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l4 4 4-4"/></g>
      <g transform="translate(309,29)" fill="none" stroke="#61666b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g>
      <text x="28" y="68" font-size="11" fill="#61666b" opacity="0.6">8s</text>
      <text x="324" y="68" font-size="11" fill="#61666b" opacity="0.6" text-anchor="end">12:00</text>
    </g>

    <g>
      <rect x="16" y="134" width="320" height="106" rx="16" fill="#ffffff" stroke="#0000001a" stroke-width="0.5" filter="url(#cardShadow)"/>
      <g clip-path="url(#clipError)">
        <rect x="16" y="205" width="320" height="35" fill="#f7f7f7"/>
        <rect x="16" y="238" width="107" height="2" fill="#ec1313" opacity="0.5"/>
        <text x="28" y="227" font-size="12" fill="#61666b">此消息将在 <tspan font-weight="600" fill="#0f1115">3</tspan> 秒后关闭，<tspan font-weight="600" fill="#0f1115">点击停止</tspan>。</text>
      </g>
      <g transform="translate(28,145)" fill="none" stroke="#ec1313" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 4.2v4.8"/>
        <circle cx="8" cy="11.6" r="1" fill="#ec1313" stroke="none"/>
      </g>
      <text x="52" y="159" font-size="13" font-weight="600" fill="#ec1313">测试失败</text>
      <g transform="translate(275,147)" fill="none" stroke="#61666b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l4 4 4-4"/></g>
      <g transform="translate(309,147)" fill="none" stroke="#61666b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g>
      <text x="28" y="186" font-size="11" fill="#61666b" opacity="0.6">8s</text>
      <text x="324" y="186" font-size="11" fill="#61666b" opacity="0.6" text-anchor="end">12:00</text>
    </g>

    <g>
      <rect x="16" y="252" width="320" height="106" rx="16" fill="#ffffff" stroke="#0000001a" stroke-width="0.5" filter="url(#cardShadow)"/>
      <g clip-path="url(#clipWarn)">
        <rect x="16" y="323" width="320" height="35" fill="#f7f7f7"/>
        <rect x="16" y="356" width="71" height="2" fill="#f59e0b" opacity="0.5"/>
        <text x="28" y="345" font-size="12" fill="#61666b">此消息将在 <tspan font-weight="600" fill="#0f1115">2</tspan> 秒后关闭，<tspan font-weight="600" fill="#0f1115">点击停止</tspan>。</text>
      </g>
      <g transform="translate(28,263)" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.3 4.6v6.8"/>
        <path d="M9.7 4.6v6.8"/>
      </g>
      <text x="52" y="277" font-size="13" font-weight="600" fill="#f59e0b">测试中断</text>
      <g transform="translate(275,265)" fill="none" stroke="#61666b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l4 4 4-4"/></g>
      <g transform="translate(309,265)" fill="none" stroke="#61666b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g>
      <text x="28" y="304" font-size="11" fill="#61666b" opacity="0.6">8s</text>
      <text x="324" y="304" font-size="11" fill="#61666b" opacity="0.6" text-anchor="end">12:00</text>
    </g>
  </g>
</svg>
